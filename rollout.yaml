apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-rollout
spec:
  replicas: 4
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
      - name: demo
        image: argoproj/rollouts-demo:blue
        ports:
        - containerPort: 8080
  strategy:
    canary:
      steps:
      - setWeight: 10
      - pause: {duration: 30s}
      # - setWeight: 50
      # - pause: {duration: 20s}
      - setWeight: 60
      - pause: {duration: 20s}
      # - analysis:
      #     templates:
      #     - templateName: success-rate-check
